<text x="329.0" y="222.5" text-anchor="middle" font-size="14.5" fill="#23262f">Creates the trip (private draft)</text>
<text x="329.0" y="241.5" text-anchor="middle" font-size="14.5" fill="#23262f">Clicks “Create trip link”</text>
<rect x="476.0" y="301.0" width="222" height="88" rx="10" fill="#f3f6ff" stroke="#4a6cf7" stroke-width="2"/>
<text x="587.0" y="340.5" text-anchor="middle" font-size="14.5" fill="#23262f">Saves trip as draft</text>
<text x="587.0" y="359.5" text-anchor="middle" font-size="14.5" fill="#23262f">Share link opens on publish</text>
<rect x="218.0" y="419.0" width="222" height="88" rx="10" fill="#f3f6ff" stroke="#4a6cf7" stroke-width="2"/>
<text x="329.0" y="458.5" text-anchor="middle" font-size="14.5" fill="#23262f">Taps the one link</text>
<text x="329.0" y="477.5" text-anchor="middle" font-size="14.5" fill="#23262f">shared on WhatsApp</text>
<rect x="476.0" y="419.0" width="222" height="88" rx="10" fill="#f3f6ff" stroke="#4a6cf7" stroke-width="2"/>
<text x="587.0" y="449.0" text-anchor="middle" font-size="14.5" fill="#23262f">2-min form: city, budget,</text>
<text x="587.0" y="468.0" text-anchor="middle" font-size="14.5" fill="#23262f">dates, top-3 trip types,</text>
<text x="587.0" y="487.0" text-anchor="middle" font-size="14.5" fill="#23262f">won’t-dos, note</text>
<rect x="734.0" y="301.0" width="222" height="88" rx="10" fill="#effaf4" stroke="#2e9d6a" stroke-width="2"/>
<text x="845.0" y="331.0" text-anchor="middle" font-size="14.5" fill="#23262f">One phone = one person</text>
<text x="845.0" y="350.0" text-anchor="middle" font-size="14.5" fill="#23262f">Edits replace old answer</text>
<text x="845.0" y="369.0" text-anchor="middle" font-size="14.5" fill="#23262f">(no duplicates)</text>
<rect x="734.0" y="537.0" width="222" height="88" rx="10" fill="#effaf4" stroke="#2e9d6a" stroke-width="2"/>
<text x="845.0" y="567.0" text-anchor="middle" font-size="14.5" fill="#23262f">Tables: trips · responses</text>
<text x="845.0" y="586.0" text-anchor="middle" font-size="14.5" fill="#23262f">results · votes</text>
<text x="845.0" y="605.0" text-anchor="middle" font-size="14.5" fill="#23262f">Single source of truth</text>
<rect x="734.0" y="773.0" width="222" height="88" rx="10" fill="#effaf4" stroke="#2e9d6a" stroke-width="2"/>
<text x="845.0" y="812.5" text-anchor="middle" font-size="14.5" fill="#23262f">Public holidays (IN)</text>
<text x="845.0" y="831.5" text-anchor="middle" font-size="14.5" fill="#23262f">→ long-weekend tags</text>
<rect x="992.0" y="301.0" width="222" height="88" rx="10" fill="#fff6cf" stroke="#c9a227" stroke-width="2"/>
<text x="1103.0" y="331.0" text-anchor="middle" font-size="14.5" fill="#23262f">Code, not AI: common dates,</text>
<text x="1103.0" y="350.0" text-anchor="middle" font-size="14.5" fill="#23262f">budget ceiling (lowest max),</text>
<text x="1103.0" y="369.0" text-anchor="middle" font-size="14.5" fill="#23262f">dealbreakers, type scores</text>
<rect x="1250.0" y="655.0" width="222" height="88" rx="10" fill="#fff1f3" stroke="#c2455a" stroke-width="2"/>
<text x="1361.0" y="685.0" text-anchor="middle" font-size="14.5" fill="#23262f">Picks 3 destinations</text>
<text x="1361.0" y="704.0" text-anchor="middle" font-size="14.5" fill="#23262f">Scores every person 0–10</text>
<text x="1361.0" y="723.0" text-anchor="middle" font-size="14.5" fill="#23262f">Strict JSON only</text>
<rect x="1250.0" y="301.0" width="222" height="88" rx="10" fill="#fff1f3" stroke="#c2455a" stroke-width="2"/>
<text x="1361.0" y="331.0" text-anchor="middle" font-size="14.5" fill="#23262f">Validates reply: drops options</text>
<text x="1361.0" y="350.0" text-anchor="middle" font-size="14.5" fill="#23262f">breaking a limit; computes</text>
<text x="1361.0" y="369.0" text-anchor="middle" font-size="14.5" fill="#23262f">group fit; saves result</text>
<rect x="1508.0" y="419.0" width="222" height="88" rx="10" fill="#fff3e0" stroke="#d9892b" stroke-width="2"/>
<text x="1619.0" y="449.0" text-anchor="middle" font-size="14.5" fill="#23262f">3 option cards + fit matrix</text>
<text x="1619.0" y="468.0" text-anchor="middle" font-size="14.5" fill="#23262f">Votes “I’m in”</text>
<text x="1619.0" y="487.0" text-anchor="middle" font-size="14.5" fill="#23262f">(one vote per phone)</text>
<rect x="1508.0" y="891.0" width="222" height="88" rx="10" fill="#fff3e0" stroke="#d9892b" stroke-width="2"/>
<text x="1619.0" y="921.0" text-anchor="middle" font-size="14.5" fill="#23262f">Reviews votes</text>
<text x="1619.0" y="940.0" text-anchor="middle" font-size="14.5" fill="#23262f">Locks final decision</text>
<text x="1619.0" y="959.0" text-anchor="middle" font-size="14.5" fill="#23262f">→ “✅ Decided” for all</text>
<text x="20" y="1034" font-size="15" fill="#23262f"><tspan font-weight="700" fill="#2e9d6a">Deliberately NOT built (scope cut): </tspan>live flight/hotel prices, bookings, payments, group chat, user accounts. The tool gives a <tspan font-weight="700">recommendation</tspan>; the group still decides.</text>
</svg>